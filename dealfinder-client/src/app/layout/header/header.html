<header class="header">
  <div class="container header-content">

    <a class="logo" routerLink="/">
      <span class="logo-badge">df</span>
      <span class="logo-text">DealFinder</span>
    </a>

    <ul class="nav-links" [class.nav-open]="menuOpen">
      <li>
        <a class="nav-link" routerLink="/marketplace" routerLinkActive="active" (click)="close()">
          Deals
        </a>
      </li>
      <li>
        <a class="nav-link" routerLink="/rankings" routerLinkActive="active" (click)="close()">
          Rankings
        </a>
      </li>
      <li>
        <a class="nav-link" routerLink="/pc-assembler" routerLinkActive="active" (click)="close()">
          Build calculator
        </a>
      </li>
      <li>
        <a class="nav-link" routerLink="/alerts" routerLinkActive="active" (click)="close()">
          Alerts
        </a>
      </li>
    </ul>

    <div class="header-actions">
      <!-- Light/dark toggle -->
      <button
        class="theme-toggle-btn"
        type="button"
        (click)="toggleTheme()"
        [title]="isDark ? 'Switch to light mode' : 'Switch to dark mode'"
        aria-label="Toggle colour theme"
      >
        <!-- Moon icon — shown in dark mode -->
        <svg *ngIf="isDark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
        <!-- Sun icon — shown in light mode -->
        <svg *ngIf="!isDark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1" x2="12" y2="3"/>
          <line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/>
          <line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
      </button>

      <!-- Sign in — placeholder, auth not yet implemented -->
      <span class="btn-signin" title="Coming soon">Sign in</span>

      <!-- Hamburger (mobile only) -->
      <button
        class="hamburger"
        type="button"
        [class.open]="menuOpen"
        (click)="toggle()"
        aria-label="Toggle navigation"
      >
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
      </button>
    </div>

  </div>
</header>
