<header class="header">
  <div class="container header-content">
    <a class="logo" routerLink="/">
      <img
        class="logo-icon-img"
        src="/logo-icon.png"
        alt="DealFinder logo"
      />

      <span>DealFinder</span>
    </a>

    <button
      class="hamburger"
      type="button"
      [class.open]="menuOpen"
      (click)="toggle()"
      aria-label="Toggle navigation"
    >
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
    </button>

    <ul class="nav-links" [class.nav-open]="menuOpen">
      <li>
        <a class="nav-link" routerLink="/marketplace" routerLinkActive="active" (click)="close()">
          Marketplace
        </a>
      </li>

      <li>
        <a class="nav-link" routerLink="/pc-assembler" routerLinkActive="active" (click)="close()">
          PC Assembler
        </a>
      </li>

      <li>
        <a class="nav-link" routerLink="/rankings" routerLinkActive="active" (click)="close()">
          Best Deals
        </a>
      </li>

      <li>
        <a class="nav-link" routerLink="/about" routerLinkActive="active" (click)="close()">
          About
        </a>
      </li>
    </ul>
  </div>
</header>
