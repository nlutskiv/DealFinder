<div class="container">
  <div class="card">
    <h1>DealFinder</h1>

    <label>Product</label>
    <input
      type="text"
      [(ngModel)]="query"
      placeholder="e.g. RTX 5070"
      (keyup.enter)="search()"
    />

    <button (click)="search()" [disabled]="loading">
      {{ loading ? 'Searching...' : 'Search' }}
    </button>

    <p class="error" *ngIf="error">{{ error }}</p>

    <div class="results" *ngIf="results.length > 0">
      <div class="result-card" *ngFor="let product of results">
        <h2>{{ product.title }}</h2>
        <p>Marketplace: {{ product.marketplace }}</p>
        <p>Price: £{{ product.price }}</p>
        <p>Score: {{ product.score }}</p>
        <a [href]="product.url" target="_blank">View listing</a>
      </div>
    </div>
  </div>
</div>
